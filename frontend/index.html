<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="netmap — a drag-and-drop network topology studio with directional cabling, inspection, and animated BFS route tracing."
    />
    <meta name="theme-color" content="#f5f5f2" />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('netmap.theme.v1')
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#0b0c0e' : '#f5f5f2')
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>netmap · topology studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
